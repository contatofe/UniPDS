<link rel="stylesheet" href="styles.css" />

<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>

<div class="container">
  <div>
    <input placeholder="Faça uma pergunta" id="input" />
    <input type="file" id="file" accept="image/*,audio/*" />
    <select name="sampling" id="sampling">
      <option value="most-predictable">Mais Previsível</option>
      <option value="predictable">Previsível</option>
      <option value="slightly-predictable">Levemente Previsível</option>
      <option value="balanced">Balanceado</option>
      <option value="slightly-creative">Levemente Criativo</option>
      <option value="creative">Criativo</option>
      <option value="most-creative">Mais Criativo</option>
    </select>
    <button id="perguntar">Perguntar</button>
  </div>
  <output id="output"></output>
</div>

<script>
  function question() {
    const text = document.getElementById("input").value.trim();
    const file = document.getElementById("file").files[0];

    const content = [];

    if (text) {
      content.push({
        type: "text",
        value: text,
      });

      if (file) {
        if (file.type.startsWith("image/")) {
          content.push({
            type: "image",
            value: file,
          });
        } else if (file.type.startsWith("audio/")) {
          content.push({
            type: "audio",
            value: file,
          });
        } else {
          throw new Error("Selecione uma imagem ou um áudio.");
        }
      }
    }
    return content;
  }

  const output = document.getElementById("output");
  const botao = document.getElementById("perguntar");

  botao.addEventListener("click", async () => {
    const content = question();

    if (content.length === 0) {
      output.textContent = "Digite uma pergunta ou selecione um arquivo.";
      return;
    }

    botao.disabled = true;
    let session;

    const samplingMode = document.getElementById("sampling").value;

    const initialPrompts = [
      {
        role: "system",
        content:
          "Você é um assistente de IA que responde de forma clara e  objetiva",
      },
    ];

    output.textContent = "Aguarde...";

    session = await LanguageModel.create({
      samplingMode: samplingMode,
      expectedInputs: [
        { type: "text", languages: ["en"] },
        { type: "image" },
        { type: "audio" },
      ],
      expectedOutputs: [{ type: "text", languages: ["en"] }],
      initialPrompts: initialPrompts,
    });

    console.log("Modo solicitado:", samplingMode);
    console.log("Modo da sessão:", session.samplingMode);

    output.textContent = "Gerando resposta...";

    const responseStream = await session.promptStreaming([
      {
        role: "user",
        content,
      },
    ]);

    output.innerHTML = "";
    let fullText = "";

    for await (const token of responseStream) {
      fullText += token;
      output.innerHTML = markdown.toHTML(fullText);
    }

    session.destroy();
    botao.disabled = false;
  });
</script>
